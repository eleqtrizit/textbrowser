[project]
name = "textbrowser"
version = "0.1.0"
description = "A CLI tool that fetches web pages headlessly and converts them to Markdown"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdownify>=0.14.1",
    "playwright>=1.50.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
]

[project.scripts]
textbrowser = "textbrowser.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pycodestyle]
max-line-length = 120
ignore = ["E251", "E221"]

[tool.isort]
include_trailing_comma = false
use_parentheses = false
line_length = 120

[tool.coverage.run]
omit = ["*/test/*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
